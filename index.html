    }

    .wrap {
      max-width: var(--max);
      margin: 24px auto;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(12, 133, 113, 0.12);
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 6px;
    }

    .meta {
      color: #555;
      font-size: .95rem;
      margin-bottom: 14px;
    }

    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #2b2f77;
      font-size: .85rem;
      margin-right: 6px;
    }

    .stem {
      margin: 12px 0 18px;
      padding: 12px 14px;
      background: #f2f4f8;
      border-left: 4px solid #0c8571;
      border-radius: 10px;
      font-weight: 600;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      border-top: 1px solid #eee;
    }

    li:first-child {
      border-top: none;
    }

    input[type="checkbox"] {
      margin-top: 2px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    label {
      cursor: pointer;
      line-height: 1.3;
    }

    .btnrow {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #ddd;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: .95rem;
    }

    button:hover {
      background: #f2f3f5;
    }

    .note {
      color: #666;
      font-size: .9rem;
      margin-top: 10px;
    }

    .error {
      color: #b00020;
      font-weight: 600;
    }

    code { font-size: .95em; }
  </style>
</head>

  const params = new URLSearchParams(window.location.search);

  const course = (params.get("course") || "").trim().toUpperCase();

  // Robust semester parsing: accept sem=2 OR sem=S2 (Canvas naming collision)
  const semRaw = (params.get("sem") || "").trim().toUpperCase();
  const semNum = (semRaw === "2" || semRaw === "S2") ? "2" : "1";

  const weekRaw = params.get("week");
  const weekKey = weekRaw ? String(weekRaw).trim() : "";

  const pillEl = document.getElementById("pill");
  const subtitleEl = document.getElementById("subtitle");
  const contentEl = document.getElementById("content");
  const buttonsEl = document.getElementById("buttons");
  const noteEl = document.getElementById("note");

  const courseObj = TARGETS[course];
  const items = courseObj?.semesters?.[semNum]?.weeks?.[weekKey];

  pillEl.textContent = courseObj ? courseObj.name : "Objetivos";

  if (!courseObj || !weekKey || !items) {
    subtitleEl.innerHTML = `<span class="error">Curso/semestre/semana no válidos.</span>`;
    contentEl.innerHTML = `
      <p>Ejemplos de enlaces:</p>
      <ul>
        <li><code>?course=S1&sem=1&week=4</code></li>
        <li><code>?course=S1&sem=2&week=1</code></li>
        <li><code>?course=S1&sem=2&week=U3</code></li>
      </ul>
    `;
    return;
  }

  subtitleEl.textContent = `· Semestre ${semNum} · Semana ${weekKey}`;

  const storageKey = `targets:${course}:sem${semNum}:week${weekKey}`;
  let state = {};

  try {
    state = JSON.parse(localStorage.getItem(storageKey)) || {};
  } catch {
    state = {};
  }

  const ul = document.createElement("ul");

  items.forEach((text, idx) => {
    const id = `cb_${course}_${semNum}_${weekKey}_${idx}`;

    const li = document.createElement("li");

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = id;
    cb.checked = !!state[idx];

    cb.addEventListener("change", () => {
      state[idx] = cb.checked;
      localStorage.setItem(storageKey, JSON.stringify(state));
    });

    const label = document.createElement("label");
    label.htmlFor = id;
    label.textContent = text;

    li.appendChild(cb);
    li.appendChild(label);
    ul.appendChild(li);
  });

  contentEl.innerHTML = "";
  contentEl.appendChild(ul);

  buttonsEl.style.display = "flex";
  noteEl.style.display = "block";

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("¿Reiniciar esta lista?")) return;
    state = {};
    localStorage.removeItem(storageKey);
    ul.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
  });

})();
